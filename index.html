<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Battle Royale</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- LOBBY -->
  <div id="lobby">
    <div class="game-title">INDIA BATTLE ROYALE</div>

    <div class="player">
      <div class="player-body">🧍</div>
    </div>

    <div class="coins">🪙 Coins: <span id="coins">0</span></div>

    <button id="startBtn">START</button>

    <div class="menu">
      <button>🛒 Store</button>
      <button>🎒 Vault</button>
      <button>⚔️ Weapons</button>
      <button>👕 Dress</button>
    </div>
  </div>

  <!-- GAME -->
  <div id="game" style="display:none;">
    <div class="topbar">
      ❤️ HP: <span id="hp">500</span>
      <span>👥 Players: 100</span>
    </div>

    <div id="map">
      <div class="fort fort1">🏰<br>चित्तौड़गढ़</div>
      <div class="fort fort2">🏰<br>मेहरानगढ़</div>
      <div class="fort fort3">🏰<br>लाल किला</div>

      <div id="player">🧍</div>
    </div>

    <div class="controls">
      <button onclick="move('up')">⬆️</button><br>
      <button onclick="move('left')">⬅️</button>
      <button onclick="move('down')">⬇️</button>
      <button onclick="move('right')">➡️</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
