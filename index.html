<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Battle Royale</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ================= HUD ================= -->

<div id="hud">
  <div>❤️ HP <span id="hp">100</span></div>
  <div>👥 ALIVE <span id="alive">100</span></div>
  <div>🔫 AMMO <span id="ammo">30</span></div>
</div>

<!-- CURRENT WEAPON -->

<div id="weaponHUD">
  🔫 Weapon:
  <span id="weapon">Pistol</span>
</div>


<!-- ================= GAME ================= -->

<div id="game">

  <!-- SAFE ZONE -->
  <div id="zone"></div>


  <!-- ================= FORTS ================= -->

  <!-- CHITTORGARH -->
  <div class="fort chittor">
    <div class="wall"></div>
    <div class="tower t1"></div>
    <div class="tower t2"></div>
    <div class="gate">GATE</div>
    <span>CHITTORGARH</span>
  </div>


  <!-- RED FORT -->
  <div class="fort redfort">
    <div class="wall"></div>
    <div class="tower t1"></div>
    <div class="tower t2"></div>
    <div class="gate">GATE</div>
    <span>RED FORT</span>
  </div>


  <!-- MEHRANGARH -->
  <div class="fort mehrangarh">
    <div class="wall"></div>
    <div class="tower t1"></div>
    <div class="tower t2"></div>
    <div class="gate">GATE</div>
    <span>MEHRANGARH</span>
  </div>


  <!-- ================= LOOT ================= -->

  <!-- PISTOL -->
  <div
    class="loot pistol"
    onclick="pickupLoot(this,'Pistol')">
    🔫
  </div>


  <!-- AK-47 -->
  <div
    class="loot ak"
    onclick="pickupLoot(this,'AK-47')">
    🔫
  </div>


  <!-- SNIPER -->
  <div
    class="loot sniper"
    onclick="pickupLoot(this,'Sniper')">
    🎯
  </div>


  <!-- AMMO -->
  <div
    class="loot ammo"
    onclick="pickupLoot(this,'Ammo')">
    📦
  </div>


  <!-- MEDKIT -->
  <div
    class="loot medkit"
    onclick="pickupLoot(this,'Medkit')">
    ❤️
  </div>


  <!-- ================= PLAYER ================= -->

  <div id="player">

    <div class="head"></div>

    <div class="body"></div>

    <div class="gun"></div>

  </div>

</div>


<!-- ================= MOBILE CONTROLS ================= -->

<div id="controls">

  <button onclick="move('up')">
    ▲
  </button>

  <div>

    <button onclick="move('left')">
      ◀
    </button>

    <button onclick="move('down')">
      ▼
    </button>

    <button onclick="move('right')">
      ▶
    </button>

  </div>

  <button id="fire" onclick="shoot()">
    🔥
  </button>

</div>


<!-- GAME SCRIPT -->

<script src="script.js"></script>

</body>
</html>
