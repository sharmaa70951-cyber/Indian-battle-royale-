<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Battle Royale</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hud">
  <div>❤️ HP <span id="hp">100</span></div>
  <div>👥 ALIVE <span id="alive">100</span></div>
  <div>🔫 AMMO <span id="ammo">30</span></div>
</div>

<div id="game">

  <!-- SAFE ZONE -->
  <div id="zone"></div>

  <!-- CHITTORGARH -->
  <div class="fort chittor">
    <div class="wall"></div>
    <div class="tower t1"></div>
    <div class="tower t2"></div>
    <div class="gate">GATE</div>
    <span>CHITTORGARH</span>
  </div>

  <!-- RED FORT -->
  <div class="fort redfort">
    <div class="wall"></div>
    <div class="tower t1"></div>
    <div class="tower t2"></div>
    <div class="gate">GATE</div>
    <span>RED FORT</span>
  </div>

  <!-- MEHRANGARH -->
  <div class="fort mehrangarh">
    <div class="wall"></div>
    <div class="tower t1"></div>
    <div class="tower t2"></div>
    <div class="gate">GATE</div>
    <span>MEHRANGARH</span>
  </div>

  <!-- PLAYER -->
  <div id="player">
    <div class="head"></div>
    <div class="body"></div>
    <div class="gun"></div>
  </div>

</div>

<!-- MOBILE CONTROLS -->
<div id="controls">
  <button onclick="move('up')">▲</button>
  <div>
    <button onclick="move('left')">◀</button>
    <button onclick="move('down')">▼</button>
    <button onclick="move('right')">▶</button>
  </div>
  <button id="fire" onclick="shoot()">🔥</button>
</div>

<script src="script.js"></script>
</body>
</html>
